<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Time Battle Tester</title>
<style>
:root{--bg:#17141f;--panel:#221d2e;--panel2:#2b2539;--line:#3a3250;--ink:#f1ecff;--dim:#a79fc0;--acc:#ffb02e;--ok:#8fe388;--bad:#ff6b6b;--blue:#4fc3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,Segoe UI,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#2a2036;border-color:var(--acc);font-weight:700}
button.sm{padding:2px 7px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#14111c;border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-width:0}
input[type=number]{width:70px}
textarea{width:100%;min-height:54px;font:12px ui-monospace,Consolas,monospace;resize:vertical}
textarea.bad{border-color:var(--bad)}
input[type=range]{flex:1;min-width:60px;accent-color:var(--acc)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 10px 0 0}
#status{color:var(--dim);flex:1;min-width:200px}
#dirty{color:var(--acc);font-weight:700}
main{display:grid;grid-template-columns:440px 1fr;height:calc(100% - 48px)}
aside{overflow:auto;border-right:1px solid var(--line);padding:8px}
section.stage{overflow:auto;padding:10px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
summary{cursor:pointer;padding:7px 10px;font-weight:700}
details>div{padding:4px 10px 10px}
.row{display:flex;gap:8px;align-items:center;margin:5px 0}
.row>label{width:128px;flex:none}
.row.wide>label{width:auto}
.hint{color:var(--dim);font-size:11.5px;margin:-2px 0 6px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px;color:var(--dim)}
.new{color:var(--blue)}
canvas{width:100%;max-width:1280px;height:auto;display:block;background:#000;border:2px solid var(--line);border-radius:6px;outline:none}
canvas:focus{border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
#result{font-size:16px;font-weight:700;min-height:24px}
#stats{color:var(--dim)}
.g0{color:#9aa3b5}.g1{color:#8fe388}.g2{color:#4fc3ff}.g3{color:#ffb02e}.g4{color:#fff}
.mults{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mults input{width:100%}
.mults span{font-size:11px;color:var(--dim);display:block}
.src{padding:5px 8px;background:var(--panel2);border-radius:6px;margin:6px 0}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}aside{border-right:0}}
.tab{border-radius:6px 6px 0 0;padding:6px 14px}.tab.on{background:var(--acc);color:#2a2036;font-weight:700;border-color:var(--acc)}
#tabs{display:flex;gap:4px;margin-bottom:8px}
.box,.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.sec.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sech{font-weight:700;font-size:14px}
.skills{max-height:340px;overflow:auto;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.sk{text-align:left;border-radius:4px;padding:3px 8px}.sk.on{background:var(--acc);color:#2a2036;border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50}
.modal>div{background:var(--panel);border:2px solid var(--acc);border-radius:10px;padding:18px 22px;max-width:520px}
.modal h2{margin:0 0 8px;font-size:17px}.modal ol{padding-left:20px;margin:8px 0 14px}.modal li{margin:6px 0}
header details.menu{position:relative;margin:0;border:0;background:none}
header details.menu>summary{list-style:none;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-weight:400}
header details.menu>summary::-webkit-details-marker{display:none}
.menuList{position:absolute;left:0;top:34px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px!important;min-width:250px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.menuList button{text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px}.menuList button:hover:not(:disabled){background:var(--panel2)}
.menuList hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.vgrid{display:grid;grid-template-columns:210px 1fr;gap:8px;margin:8px 0 12px}.vcol{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:4px}
.skhead{position:sticky;top:0;z-index:1;background:var(--panel);border-top:3px solid var(--acc);margin-top:8px;padding:4px 2px 2px;font-weight:700;font-size:12px;color:var(--acc)}
.skhead:first-child{margin-top:0}
.welcome{padding:6px 4px}.welcome h2{margin:4px 0 8px}.welcome ol{padding-left:20px}.welcome li{margin:8px 0}
.welcome .big{font-size:15px;padding:10px 18px;margin:8px 0}.warn{color:var(--bad)}
</style>
</head>
<body>
<header>
	<h1>Quick Time Battle Tester</h1>
	<button id="btnOpen" class="pri">Open project folder</button>
	<button id="btnReconnect" style="display:none">Reconnect</button>
	<button id="btnUndo" disabled title="Undo the last change (Ctrl+Z)">↶ Undo</button>
	<button id="btnSave" disabled>Save to plugin</button>
	<details id="fileMenu" class="menu"><summary>More ▾</summary><div class="menuList">
		<button id="mOpen">Open project folder…</button>
		<button id="mSave" disabled>Save to plugin</button>
		<hr>
		<button id="btnRevert" title="Throw away all unsaved changes">Revert unsaved changes</button>
		<button id="mReset" title="Put every setting back to the plugin defaults (Undo still works)">Reset all settings to defaults…</button>
		<hr>
		<button id="btnLoadFile" title="Load a details.json file">Load details.json…</button>
		<button id="btnDownload" title="Download the edited details.json">Download details.json</button>
	</div></details>
	<span id="dirty"></span>
	<span id="status"></span>
	<input id="fileIn" type="file" accept=".json,application/json" hidden>
</header>
<main>
<aside><div id="tabs"></div><div id="side"></div></aside>
<section class="stage">
	<canvas id="cv" width="1280" height="720" tabindex="0"></canvas>
	<div class="bar">
		<button id="btnRun" class="pri">▶ Run challenge</button>
		<button id="btnDodge">Dodge test</button>
		<label><input type="checkbox" id="auto" checked> Re-run on change</label>
		<label>Stage <select id="size"><option value="960x540">960×540</option><option value="1280x720" selected>1280×720</option><option value="1600x900">1600×900</option><option value="1920x1080">1920×1080</option></select></label>
		<label id="previewWrap" style="display:none">Preview skill <select id="previewSkill"></select></label>
		<label>Enemies <select id="nEnemies"><option>1</option><option>2</option><option>3</option></select></label>
		<span class="hint" style="margin:0">Click the stage, then press W A S D / Enter</span>
	</div>
	<div id="result"></div>
	<div id="runup" class="hint"></div>
	<div id="stats"></div>
</section>
</main>
<script>
"use strict";
const EMBED_CODE = "// Quick Time Battle v1.1.0 - RPG Paper Maker 3.0 plugin.\n// Hero attacks and skills run a WASD + Enter quick-time challenge; the grade scales damage.\n// Press any key just before an enemy hit lands to dodge it. See FULL_INSTRUCTIONS.md.\n// Plugins run through `new Function(...)`: no imports. Globals: Common, Core, Data, Manager, Model, Scene.\n\nconst pluginName = \"Quick Time Battle\";\n\n// ---------------------------------------------------------------- config\n// Every setting is a plugin parameter. ID -> challenge tables are JSON text; \"Advanced Overrides\" is merged on top.\nconst DEFAULT_TABLES = {\n\telementThemes: { \"1\": \"fire\", \"2\": \"earth\", \"3\": \"lightning\", \"4\": \"water\", \"5\": \"ice\", \"6\": \"wind\", \"7\": \"shadow\", \"8\": \"light\" },\n\tnameThemes: [\n\t\t{ match: \"heal|bandage|revive|remedy|barrier\", theme: \"heal\" },\n\t\t{ match: \"power|war cry|resolve|concentration\", theme: \"light\" }\n\t],\n\tdefault: { type: \"timing\" },\n\tskills: {},\n\theroes: {},\n\tclasses: {}\n};\n\nconst DEFAULT_CONFIG = Object.assign({\n\tmultipliers: [0.5, 1.0, 1.25, 1.5, 2.0], // Miss, Good, Great, Excellent, Perfect\n\tfailMiss: false, // true: a Miss really fails; false: a Miss just pays the Miss multiplier\n\tperfectCrit: true, // a Perfect also forces a critical hit\n\tlabels: [\"OOPS...\", \"GOOD\", \"GREAT\", \"EXCELLENT!\", \"PERFECT!!\"],\n\tsound: true,\n\tvolume: 0.5,\n\ttiering: true, // \"Fire 1/2/3\" style names get harder challenges\n\tuiScale: 1, // size of the challenge UI\n\tuiStyle: \"pixel\", // \"pixel\" (chunky, matches the engine) or \"polished\" (smooth)\n\tpixelSize: 0, // screen pixels per UI pixel; 0 = automatic\n\tfxScale: 1.6, // size of particles and bursts\n\tdebug: false,\n\tbattleLog: true, // keeps a rolling log of recent challenge/defense events\n\tlogEntries: 150,\n\timpactTiming: true, // damage lands on the attacker's slash frame\n\toverhead: true, // prompts float above the active hero\n\thintUses: 4, // text hints fade out after this many uses of each challenge type\n\tbeatPulse: true,\n\tfreezeScale: 1, // impact freeze length multiplier (0 = off)\n\tlingerMs: 1000, // how long damage/heal numbers stay up\n\tdefense: { enabled: true, windowFrames: 12, cooldown: 0.6, slide: 1, duration: 0.45, keys: [\"W\", \"A\", \"S\", \"D\", \"ENTER\"] }\n}, DEFAULT_TABLES);\n\nfunction param(name, fallback) {\n\ttry {\n\t\tconst v = Manager.Plugins.getParameter(pluginName, name);\n\t\treturn v === undefined || v === null ? fallback : v;\n\t} catch (e) {\n\t\treturn fallback; // parameter missing (older saved plugin settings)\n\t}\n}\nfunction boolParam(name, fb) { const v = param(name, fb); return typeof v === \"boolean\" ? v : String(v).toLowerCase() === \"true\"; }\nfunction numParam(name, fb) { const v = Number(param(name, fb)); return isFinite(v) ? v : fb; }\nfunction jsonParam(name, fb) {\n\tconst raw = param(name, null);\n\tif (typeof raw !== \"string\" || raw.trim() === \"\") return fb;\n\ttry { return JSON.parse(raw); } catch (e) {\n\t\tconsole.error('[QTB] Parameter \"' + name + '\" is not valid JSON, using the default.', e);\n\t\treturn fb;\n\t}\n}\n\nfunction loadConfig() {\n\tconst D = DEFAULT_CONFIG;\n\tlet mult = String(param(\"Multipliers\", D.multipliers.join(\", \"))).split(/[\\s,]+/).map(Number).filter(isFinite);\n\tif (mult.length < 2) mult = D.multipliers.slice();\n\twhile (mult.length < 5) mult.push(mult[mult.length - 1] * 1.33);\n\tconst cfg = {\n\t\tmultipliers: mult,\n\t\tfailMiss: boolParam(\"Fail On Miss\", D.failMiss),\n\t\tperfectCrit: boolParam(\"Perfect Crit\", D.perfectCrit),\n\t\tlabels: D.labels,\n\t\tsound: boolParam(\"Sound\", D.sound),\n\t\tvolume: numParam(\"Volume\", D.volume),\n\t\ttiering: boolParam(\"Tiering\", D.tiering),\n\t\tuiScale: numParam(\"UI Scale\", D.uiScale),\n\t\tuiStyle: String(param(\"UI Style\", D.uiStyle)).toLowerCase(),\n\t\tpixelSize: numParam(\"Pixel Size\", D.pixelSize),\n\t\tfxScale: numParam(\"Effects Scale\", D.fxScale),\n\t\tdebug: boolParam(\"Debug\", D.debug),\n\t\tbattleLog: boolParam(\"Battle Log\", D.battleLog),\n\t\tlogEntries: numParam(\"Battle Log Entries\", D.logEntries),\n\t\timpactTiming: boolParam(\"Damage At Slash Frame\", D.impactTiming),\n\t\toverhead: boolParam(\"Prompts Over Head\", D.overhead),\n\t\thintUses: numParam(\"Hint Uses\", D.hintUses),\n\t\tbeatPulse: boolParam(\"Beat Pulse\", D.beatPulse),\n\t\tfreezeScale: numParam(\"Impact Freeze Scale\", D.freezeScale),\n\t\tlingerMs: numParam(\"Popup Linger\", D.lingerMs),\n\t\tdefense: {\n\t\t\tenabled: boolParam(\"Defense Enabled\", D.defense.enabled),\n\t\t\twindowFrames: numParam(\"Defense Window Frames\", D.defense.windowFrames),\n\t\t\tcooldown: numParam(\"Defense Cooldown\", D.defense.cooldown),\n\t\t\tslide: numParam(\"Defense Slide Distance\", D.defense.slide),\n\t\t\tduration: numParam(\"Defense Slide Duration\", D.defense.duration),\n\t\t\tkeys: D.defense.keys\n\t\t},\n\t\telementThemes: jsonParam(\"Element Themes\", D.elementThemes),\n\t\tnameThemes: jsonParam(\"Name Themes\", D.nameThemes),\n\t\tdefault: jsonParam(\"Default Challenge\", D.default),\n\t\tclasses: jsonParam(\"Class Challenges\", D.classes),\n\t\theroes: jsonParam(\"Hero Challenges\", D.heroes),\n\t\tskills: jsonParam(\"Skill Challenges\", D.skills)\n\t};\n\tconst over = jsonParam(\"Advanced Overrides\", {});\n\tfor (const k of Object.keys(over)) {\n\t\tif (k === \"defense\") Object.assign(cfg.defense, over.defense);\n\t\telse cfg[k] = over[k];\n\t}\n\tcfg.uiScale = Math.max(0.2, cfg.uiScale);\n\treturn cfg;\n}\n\nlet CONFIG = DEFAULT_CONFIG;\nlet enabled = true;\n\n// Rolling log: the last N events are kept in memory and written to Saves/qtb-log.json (a few KB at most),\n// so it never grows over time. With Debug on, events are also printed to the console (Ctrl+Shift+I).\nlet logBuf = [];\nlet logDirty = false;\nlet logLastFlush = 0;\nfunction blog(msg, data) {\n\tif (CONFIG.debug) console.log(\"[QTB]\", msg, data === undefined ? \"\" : data);\n\tif (!CONFIG.battleLog) return;\n\tlet d = data;\n\ttry { d = data === undefined ? undefined : JSON.parse(JSON.stringify(data)); } catch (e) { d = String(data); }\n\tlogBuf.push({ t: new Date().toISOString().slice(11, 23), msg, data: d });\n\tconst max = Math.max(20, CONFIG.logEntries | 0);\n\tif (logBuf.length > max) logBuf.splice(0, logBuf.length - max);\n\tlogDirty = true;\n}\nfunction dbg() { blog([].slice.call(arguments).map(String).join(\" \")); }\nfunction flushLog(force) {\n\tif (!CONFIG.battleLog || !logDirty) return;\n\tconst now = performance.now();\n\tif (!force && now - logLastFlush < 4000) return;\n\tlogLastFlush = now; logDirty = false;\n\ttry { Common.Platform.writeFile(Common.Paths.SAVES + \"/qtb-log.json\", { plugin: \"Quick Time Battle\", entries: logBuf }); } catch (e) { /* logging must never break the game */ }\n}\n\n// Priority: hero+skill > class+skill > skill > hero default > class default > global default.\n// `false` disables quick-time for that entry. Skills with no damage effect (buffs, status-only)\n// only get a challenge when explicitly listed (hero/class/global skills entry).\nfunction resolveChallenge(heroId, classId, skillId, hasDamage) {\n\tconst hero = CONFIG.heroes[heroId], cls = CONFIG.classes[classId];\n\tif (hero && hero.skills && hero.skills[skillId] !== undefined) return hero.skills[skillId];\n\tif (cls && cls.skills && cls.skills[skillId] !== undefined) return cls.skills[skillId];\n\tif (CONFIG.skills[skillId] !== undefined) return CONFIG.skills[skillId];\n\tif (!hasDamage) return false;\n\tif (hero && hero.default !== undefined) return hero.default;\n\tif (cls && cls.default !== undefined) return cls.default;\n\treturn CONFIG.default;\n}\n\n// \"Fire 1\" / \"Ice II\" / \"Wind 3\" -> 1..5 (1 when there is no numeral).\nfunction tierOf(name) {\n\tconst m = /(\\d+|IV|V?I{1,3})\\s*$/i.exec(name || \"\");\n\tif (!m) return 1;\n\tconst roman = { I: 1, II: 2, III: 3, IV: 4, V: 5 }[m[1].toUpperCase()];\n\treturn Math.max(1, Math.min(5, roman || parseInt(m[1], 10) || 1));\n}\n\n// Harder challenge for higher tiers: tighter windows, longer sequences, bigger mash goals.\nfunction applyTier(def, tier) {\n\tif (!def || def === true || tier <= 1 || !CONFIG.tiering) return def;\n\tconst k = tier - 1, d = Object.assign({}, def);\n\tif (d.duration) d.duration *= Math.pow(0.88, k);\n\tif (d.type === \"timing\" || d.type === \"hold\") d.zone = (d.zone || 0.16) * Math.pow(0.82, k);\n\tif (d.type === \"ring\" || d.type === \"crosshair\" || d.type === \"combo\") d.tolerance = (d.tolerance || 0.1) * Math.pow(0.85, k);\n\tif (d.type === \"greenlight\") d.window = (d.window || 1) * Math.pow(0.88, k);\n\tif (d.type === \"sequence\") d.length = (d.length || 4) + k;\n\tif (d.type === \"mash\") d.count = Math.round((d.count || 8) * (1 + 0.3 * k));\n\treturn d;\n}\n\n// ---------------------------------------------------------------- themes\nconst THEMES = {\n\tplain:     { accent: \"#fd4\",    zone: \"#4a9\",    bar: \"#555\",    colors: [\"#ffffff\", \"#dfe8ff\"],            wave: \"square\",   style: \"sparkle\" },\n\tfire:      { accent: \"#ff9a2e\", zone: \"#c8321e\", bar: \"#3a1a12\", colors: [\"#ff5a1e\", \"#ffb02e\", \"#ffe27a\"], wave: \"triangle\", style: \"rise\"    },\n\tlightning: { accent: \"#ffe95c\", zone: \"#3d5bff\", bar: \"#1a1f3a\", colors: [\"#ffffff\", \"#bfe8ff\", \"#ffe95c\"], wave: \"sawtooth\", style: \"spark\"   },\n\tice:       { accent: \"#a8ecff\", zone: \"#3b8fd9\", bar: \"#16283a\", colors: [\"#ffffff\", \"#bfeaff\", \"#7fc8ff\"], wave: \"sine\",     style: \"fall\"    },\n\twater:     { accent: \"#4fc3ff\", zone: \"#1f6fd1\", bar: \"#10243a\", colors: [\"#9fe0ff\", \"#4fc3ff\", \"#ffffff\"], wave: \"sine\",     style: \"fall\"    },\n\tearth:     { accent: \"#d9a85a\", zone: \"#7a5a2e\", bar: \"#2e2216\", colors: [\"#a67c3d\", \"#6b4f2a\", \"#d9a85a\"], wave: \"triangle\", style: \"fall\"    },\n\twind:      { accent: \"#9dffc2\", zone: \"#2fa36b\", bar: \"#13302a\", colors: [\"#ffffff\", \"#c7ffe0\", \"#9dffc2\"], wave: \"sine\",     style: \"streak\"  },\n\tlight:     { accent: \"#fff3a8\", zone: \"#e0b84a\", bar: \"#3a3320\", colors: [\"#ffffff\", \"#fff3a8\", \"#ffe27a\"], wave: \"sine\",     style: \"rise\"    },\n\theal:      { accent: \"#7dff9a\", zone: \"#2fa36b\", bar: \"#12301f\", colors: [\"#ffffff\", \"#b8ffcb\", \"#7dff9a\"], wave: \"sine\",     style: \"rise\"    },\n\tshadow:    { accent: \"#c06bff\", zone: \"#5a2a8a\", bar: \"#1d1230\", colors: [\"#7a3fb8\", \"#c06bff\", \"#2a1040\"], wave: \"sawtooth\", style: \"wisp\"    }\n};\nfunction themeOf(name) { return THEMES[name] || THEMES.plain; }\n\n// ---------------------------------------------------------------- sound (synthesised, no asset files)\nlet actx = null;\nfunction audio() {\n\tif (!CONFIG.sound) return null;\n\ttry {\n\t\tif (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();\n\t\tif (actx.state === \"suspended\") actx.resume();\n\t\treturn actx;\n\t} catch (e) { return null; }\n}\n// Audio must never break the game: bad values are ignored and all calls are guarded.\nfunction tone(freq, dur, type, vol, slideTo, delay) {\n\ttry {\n\t\tif (!isFinite(freq) || freq <= 0 || !isFinite(dur) || dur <= 0) return;\n\t\tbeatAt = performance.now();\n\t\tconst a = audio();\n\t\tif (!a) return;\n\t\tconst t = a.currentTime + (isFinite(delay) ? delay : 0), o = a.createOscillator(), g = a.createGain();\n\t\to.type = type || \"sine\";\n\t\to.frequency.setValueAtTime(freq, t);\n\t\tif (isFinite(slideTo) && slideTo > 0) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);\n\t\tg.gain.setValueAtTime(Math.max(0.0001, CONFIG.volume * (isFinite(vol) ? vol : 1) * 0.3), t);\n\t\tg.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n\t\to.connect(g); g.connect(a.destination);\n\t\to.start(t); o.stop(t + dur + 0.02);\n\t} catch (e) { dbg(\"tone failed\", e); }\n}\nfunction noise(dur, vol, freq, delay, filterType) {\n\ttry {\n\t\tif (!isFinite(dur) || dur <= 0 || !isFinite(freq) || freq <= 0) return;\n\t\tconst a = audio();\n\t\tif (!a) return;\n\t\tconst t = a.currentTime + (isFinite(delay) ? delay : 0), n = Math.floor(a.sampleRate * dur);\n\t\tconst buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);\n\t\tfor (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;\n\t\tconst src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();\n\t\tsrc.buffer = buf; f.type = filterType || \"bandpass\"; f.frequency.value = freq;\n\t\tg.gain.setValueAtTime(Math.max(0.0001, CONFIG.volume * (isFinite(vol) ? vol : 1) * 0.4), t);\n\t\tg.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n\t\tsrc.connect(f); f.connect(g); g.connect(a.destination);\n\t\tsrc.start(t);\n\t} catch (e) { dbg(\"noise failed\", e); }\n}\nconst NOTES = [523, 659, 784, 1047, 1319];\nfunction sfxResult(grade, theme) {\n\tif (grade === 0) { tone(150, 0.35, \"sawtooth\", 1, 55); return; }\n\tconst notes = Math.min(NOTES.length, Math.min(4, grade) + (grade >= 3 ? 1 : 0));\n\tfor (let i = 0; i < notes; i++) tone(NOTES[i], 0.18, themeOf(theme).wave, 1, null, i * 0.07);\n\tif (theme === \"fire\") noise(0.25 + grade * 0.15, 0.8 + grade * 0.3, 700 + grade * 300);\n\telse if (theme === \"lightning\") for (let i = 0; i < Math.min(5, grade + (grade === 4 ? 1 : 0)); i++) noise(0.12, 1.2, 3500, i * 0.09, \"highpass\");\n\telse if (theme === \"ice\") for (let i = 0; i < grade; i++) tone(1800 + i * 400, 0.25, \"sine\", 0.6, null, i * 0.05);\n\telse if (theme === \"heal\") for (let i = 0; i < grade + 1; i++) tone(659 + i * 220, 0.35, \"sine\", 0.6, null, 0.05 + i * 0.07);\n\telse if (theme === \"water\") for (let i = 0; i < grade + 1; i++) tone(500, 0.12, \"sine\", 0.8, 1200, i * 0.07);\n\telse if (theme === \"earth\") { tone(90, 0.3 + grade * 0.1, \"triangle\", 1.2, 45); noise(0.2, 0.8, 300, 0, \"lowpass\"); }\n\telse if (theme === \"wind\") noise(0.3 + grade * 0.15, 0.8, 1500 + grade * 500);\n\telse if (theme === \"light\") for (let i = 0; i < grade + 1; i++) tone(1568 + i * 330, 0.3, \"sine\", 0.6, null, 0.1 + i * 0.06);\n\telse if (theme === \"shadow\") { tone(220, 0.5, \"sawtooth\", 0.7, 55); noise(0.3, 0.6, 400, 0, \"lowpass\"); }\n}\n// ---------------------------------------------------------------- visual effects\n// Sizes are authored for a 720 px tall canvas and scaled by fxE (screen size x Effects Scale).\nlet particles = [];\nlet bolts = [];\nlet slashes = [];\nlet rings = [];\nlet flash = 0;\nlet flashColor = \"255,255,255\";\nlet auras = []; // [{ theme, x, y, power }] glow behind every target while a challenge runs\nlet fxE = 1; // effects scale\nconst rnd = (a, b) => a + Math.random() * (b - a);\nconst pick = arr => arr[Math.floor(Math.random() * arr.length)];\n\nfunction updateScales() {\n\tconst cv = Common.Platform.canvasHUD;\n\tfxE = (cv.height / 720) * CONFIG.fxScale;\n}\nfunction clearFx() { particles = []; bolts = []; slashes = []; rings = []; flash = 0; auras = []; }\n\nfunction confetti(n, x, y) {\n\tconst cols = [\"#ff5a5a\", \"#ffb02e\", \"#ffe27a\", \"#8fe388\", \"#4fc3ff\", \"#c58bff\", \"#ffffff\"], E = fxE;\n\tfor (let i = 0; i < n; i++) {\n\t\tconst a = -Math.PI / 2 + rnd(-1.1, 1.1), sp = rnd(180, 460) * E;\n\t\tparticles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.9, 1.6), max: 1.2, size: rnd(7, 13) * E, c: pick(cols), conf: true, rot: rnd(0, 6), vr: rnd(-9, 9) });\n\t}\n}\nfunction emit(theme, x, y, power) { // one ambient particle; power 0..1\n\tif (theme === \"plain\") return; // basic attacks: no ambient effects\n\tconst T = themeOf(theme), c = pick(T.colors), E = fxE;\n\tswitch (T.style) {\n\t\tcase \"rise\": // flames / light motes\n\t\t\tparticles.push({ x: x + rnd(-34, 34) * E, y: y + rnd(0, 24) * E, vx: rnd(-14, 14) * E, vy: rnd(-130, -60) * E * (0.7 + power), life: rnd(0.5, 1.1), max: 1.1, size: rnd(7, 15) * E * (0.7 + power * 0.6), c, add: true, round: true }); break;\n\t\tcase \"spark\":\n\t\t\tpart 	const lbl = (inst.api.getConfig && inst.api.getConfig().labels) || [];

function fail(e) {

function stepDodge(now) {
	const sc = scene, D = (inst.api.getConfig() || {}).defense || {};
	const FR = 20, DUR = 50, ATTACK = (FR - 1) * DUR;
	if (sc.phase === "wait" && now >= sc.startAt) {
		sc.phase = "attack";
		sc.hitAt = now + ATTACK;
		const u = { player: { kind: 1, id: 1 }, damagePosition: { x: 0, y: 0 }, isStepAttacking: () => true, frameAttacking: { value: 0, duration: DUR, tick: 0 }, updateUVs() {} };
		sc.user = u;
		sc.battle = { user: u, subStep: 0, forceAnAction: false, effects: [sc.effect], targets: [sc.heroB], battleCommandKind: inst.K.NONE };
		inst.Scene.Map.current.user = u;
		sc.ba = new inst.BA(sc.battle);

	if (sc.phase === "attack") {

		sc.user.frameAttacking.value = Math.max(0, FR - 1 - left);

		if (now >= sc.hitAt) {

			sc.effect.executeDamages(sc.user);
			const ev = sc.heroB.tempIsDamagesMiss === true;
			const last = sc.presses.length ? sc.presses[sc.presses.length - 1] : null;
			const winMs = (D.windowFrames || 12) / 60 * 1000;
			let msg;
			if (ev) msg = "EVADED — pressed " + Math.round(sc.hitAt - last) + " ms before the hit (window " + Math.round(winMs) + " ms).";
			else if (!sc.presses.length) msg = "No press — hit landed.";
			else if (sc.pressedBefore) msg = "Too early — " + Math.round(sc.hitAt - sc.pressedBefore) + " ms before the hit, window is " + Math.round(winMs) + " ms.";
			else msg = "Missed the window.";
			sc.outcome = ev ? "ok" : "bad"; sc.msg = msg;
			$("result").textContent = msg; $("result").className = ev ? "g1" : "g0";
		}

}

function stepHero(now) {
	const sc = scene, { s, heroX, enemyX } = layout();
	sc.ba.update();
	const b = sc.battle;
	const reach = enemyX - heroX + 28 * s; // negative: the hero is on the right
	const stage = b.subStep === 3 ? Math.min(1, (now - sc.ba.t0) / 650) : 1;
	sc.heroX = heroX + reach * (sc.ran ? (sc.back ? Math.max(0, 1 - (now - sc.back) / 300) : stage) : 0);
	sc.user.damagePosition.x = sc.heroX;
	const q = inst.api.getQte && inst.api.getQte();
	if (q) {
		sc.seenQte = true;
		const g = q.challenge.grade;
		if (g !== null && sc.grade === null) {
			sc.grade = g; S.stats[g]++; sc.slashAt = now;
			const cfg = inst.api.getConfig(), m = cfg.multipliers[g], lab = cfg.labels[g];
			$("result").textContent = lab + "  ×" + m + "   (100 damage → " + Math.round(100 * m) + (g === 4 && cfg.perfectCrit ? ", critical" : "") + ")";
			$("result").className = "g" + g;
			renderStats();
		}
	} else {
		if (sc.seenQte && !sc.back) sc.back = now;
		if (!sc.seenQte && !sc.slashAt && b.subStep !== 3 && now - sc.t0 > 600 + (sc.ran ? 700 : 0)) sc.slashAt = now; // no challenge: plain attack
	}

	if (sc.slashAt) { const k = now - sc.slashAt; sc.swing = k < 110 ? -1 + 2 * (k / 110) : (k < 700 ? 1 : 1 - Math.min(1, (k - 700) / 400)); }

// ------------------------------------------------------------ drawing
function drawBackground(c, W, H) {

	sky.addColorStop(0, "#7ec8f2"); sky.addColorStop(1, "#cdeeff");
	c.fillStyle = sky; c.fillRect(0, 0, W, H * 0.55);
	c.fillStyle = "#6a9a46"; c.fillRect(0, H * 0.55, W, H * 0.45);
	c.fillStyle = "#5b8a3c";

}
// Actors face right in local space; face = 1 (right) or -1 (left). swing: -1 sword raised behind ... +1 swung through.
function drawActor(c, x, y, s, body, face, swing, flash) {

	c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(0, 0, 11 * s, 3.5 * s, 0, 0, 6.3); c.fill();
	c.scale(face, 1);

	c.fillStyle = body; c.fillRect(-6 * s, -23 * s, 12 * s, 15 * s);
	c.fillStyle = "#ffd9b0"; c.fillRect(-5 * s, -32 * s, 10 * s, 9 * s);
	c.fillStyle = "#222"; c.fillRect(1 * s, -29 * s, 2 * s, 2 * s);
	if (flash > 0) { c.fillStyle = "rgba(255,255,255," + flash + ")"; c.fillRect(-6 * s, -32 * s, 12 * s, 32 * s); }

	c.save(); c.translate(6 * s, -16 * s);
	c.rotate(0.55 + (swing || 0) * 1.45);
	c.fillStyle = "#5a3b22"; c.fillRect(-1 * s, -2 * s, 2 * s, 5 * s);
	c.fillStyle = "#8a6a2e"; c.fillRect(-3.5 * s, -3.5 * s, 7 * s, 1.6 * s);
	c.fillStyle = "#e8eef5"; c.fillRect(-1.3 * s, -20 * s, 2.6 * s, 16.5 * s);
	c.fillStyle = "#aab6c6"; c.fillRect(0.3 * s, -20 * s, 1 * s, 16.5 * s);

	c.restore();
}
function drawFrame(now) {
	const { W, H, s, heroX, enemyX, feetY } = layout();

		drawActor(ctx, enemyX, feetY - 2 * s, s, "#c0392b", 1, 0);
		drawActor(ctx, heroX, feetY, s, "#3a6fd8", -1, 0);
		return;
	}
	if (scene.type === "hero") {
		const n = scene.targets.length, kk = scene.slashAt ? now - scene.slashAt - 80 : -1;
		const shaking = kk > 0 && kk < 260;
		for (let i = 0; i < n; i++) {
			const tp = scene.targets[i].damagePosition;
			drawActor(ctx, tp.x + (shaking ? Math.sin(kk / 18) * 5 * s * (1 - kk / 260) : 0), tp.y + 34 * s, s, scene.targets[i].ally ? "#3a6fd8" : "#c0392b", 1, 0, shaking ? 0.6 * (1 - kk / 260) : 0);
		}

		drawActor(ctx, hx, feetY, s, "#3a6fd8", -1, 0);
		sc.heroB.damagePosition.x = hx;
		inst.BA.prototype.drawHUDStep.call(sc.ba || { battle: { user: {} } });

}

let last = NOW();
function loop(now) {
	requestAnimationFrame(loop);
	now = NOW();
	try {
		if (inst && scene) { scene.type === "hero" ? stepHero(now) : stepDodge(now); }
		drawFrame(now);
	} catch (e) { fail(e); }
	last = now;
}

const keyName = e => e.key === "Enter" ? "ENTER" : (e.key.length === 1 && /[a-z0-9]/i.test(e.key) ? e.key.toUpperCase() : null);

	if (!gameActive()) return;
	e.preventDefault();
	if (e.repeat) return;
	if (scene.type === "hero") scene.ba.onKeyPressedStep(key);
	else {
		const n = NOW();

			scene.lateShown = true;
			$("result").textContent = "LATE — pressed " + Math.round(n - scene.afterAt) + " ms after the hit.";
		}
		if (scene.phase === "wait" || (scene.phase === "attack" && scene.hitAt - n > ((inst.api.getConfig().defense || {}).windowFrames || 12) / 60 * 1000)) scene.pressedBefore = scene.pressedBefore || n;

	const off = def === false;

	host.append(el("div", { className: "row wide" }, offBox, el("label", { textContent: "No challenge (off)" })));
	if (off) return;
	const cur = (def === true || typeof def !== "object") ? { type: "timing" } : def;
	const upd = () => { setAt(path, cur); scheduleRerun(); };
	const typeSel = el("select");

	themeSel.value = cur.theme || "";

	host.append(el("div", { className: "row" }, el("label", { textContent: "Theme" }), themeSel));
	for (const [key, min, max, step, dflt] of TYPE_FIELDS[cur.type || "timing"]) {
		const val = cur[key] !== undefined ? cur[key] : dflt;
		const rng = el("input", { type: "range", min, max, step, value: val });

		const reset = el("button", { className: "sm", textContent: "↺", title: "Back to default (" + dflt + ")" });
		const set = v => { v = Number(v); if (!isFinite(v)) return; cur[key] = v; rng.value = num.value = v; upd(); };
		rng.oninput = () => set(rng.value);

		host.append(el("div", { className: "row" }, el("label", { textContent: key }), rng, num, reset));
	}
	if (cur.type === "sequence") {
		const inp = el("input", { type: "text", value: Array.isArray(cur.keys) ? cur.keys.join(",") : "", placeholder: "random (or W,A,S,D…)" });
		inp.onchange = () => { const ks = inp.value.split(/[\s,]+/).filter(Boolean).map(x => x.toUpperCase()); if (ks.length) cur.keys = ks; else delete cur.keys; upd(); };
		host.append(el("div", { className: "row" }, el("label", { textContent: "keys" }), inp));

		inp.onchange = () => { const k = inp.value.trim().toUpperCase(); if (k && k !== "ENTER") cur.key = k; else delete cur.key; upd(); };
		host.append(el("div", { className: "row" }, el("label", { textContent: "key" }), inp));
	}
	const rm = el("button", { className: "sm", textContent: "Remove this entry (inherit)" });
	rm.onclick = () => { setAt(path, undefined); renderEditor(); scheduleRerun(); };
	host.append(el("div", { className: "row" }, rm));
}

function skillInfo(sk) { // what the plugin needs to know about a database skill
	const r = sk.raw, effects = r.e || [];
	const dmg = effects.filter(e => !e.k);
	let element = 0;
	if (dmg[0] && dmg[0].ide) element = dmg[0].deid ? dmg[0].deid.v : 1;
	let tag = "";
	for (const e of effects) if (e.k === 6) { const m = /\/\/\s*qtb[^\n"]*/i.exec(JSON.stringify(e).replace(/\\n/g, "\n")); if (m) tag = m[0].trim(); }
	return { name: sk.name, damaging: dmg.length > 0, element, runOn: !!(r.roe && r.roe.v), tag };
}
function selectSkill(id, quiet) {

function control(def) {
	const [name, w, a, b, c] = def;
	const p = P(name); if (!p) return null;
	const wrap = el("div");
	const label = (extra) => el("label", { title: p.desc, innerHTML: "" }, name, extra || "");
	const hint = p.desc ? el("div", { className: "hint", textContent: p.desc }) : null;
	if (w === "bool") {
		const i = el("input", { type: "checkbox", checked: p.v });
		i.onchange = () => setParam(name, i.checked);
		wrap.append(el("div", { className: "row" }, label(), i));
	} else if (w === "num") {
		const r = el("input", { type: "range", min: a, max: b, step: c, value: p.v });
		const n = el("input", { type: "number", min: a, max: b, step: c, value: p.v });
		r.oninput = () => { n.value = r.value; setParam(name, r.value); };
		n.oninput = () => { r.value = n.value; setParam(name, n.value); };
		wrap.append(el("div", { className: "row" }, label(), r, n));
	} else if (w === "sel") {
		const s = el("select"); for (const o of a) s.append(el("option", { value: o, textContent: o }));
		s.value = String(p.v).toLowerCase();
		s.onchange = () => setParam(name, s.value);
		wrap.append(el("div", { className: "row" }, label(), s));
	} else if (w === "mult") {
		const vals = String(p.v).split(/[\s,]+/).map(Number); while (vals.length < 5) vals.push(vals[vals.length - 1] || 1);
		const g = el("div", { className: "mults" });
		const names = ["OOPS", "Good", "Great", "Excl.", "Perfect"];
		const ins = vals.slice(0, 5).map((v, i) => {
			const inp = el("input", { type: "number", step: 0.05, value: v });
			inp.oninput = () => setParam(name, ins.map(x => x.value).join(", "));
			g.append(el("div", {}, el("span", { textContent: names[i] }), inp));
			return inp;
		});
		wrap.append(el("div", { className: "row wide" }, label()), g);
	} else if (w === "var") {
		const n = el("input", { type: "number", min: 0, step: 1, value: p.v });
		n.oninput = () => { setParam(name, n.value); renderSide(); };
		const row = el("div", { className: "row" }, label(), el("span", { className: "tag", textContent: "variable #" }), n);
		if (p.v > 0) {
			const hid = heroForVariable(p.v);
			row.append(el("span", { className: "tag", textContent: hid && S.db ? "= " + dbName("heroes", hid, "Hero") : "= (set it on the Characters tab)" }));
		}
		wrap.append(row);
		return wrap;
	} else if (w === "json") {
		const t = el("textarea", { value: p.v });
		const check = () => { try { if (t.value.trim()) JSON.parse(t.value); t.classList.remove("bad"); return true; } catch (e) { t.classList.add("bad"); return false; } };
		t.oninput = () => { if (check()) { setParam(name, t.value); updateResolveInfo(); } };
		t.onchange = () => { renderEditor(); };
		wrap.append(el("div", { className: "row wide" }, label()), t);
	}
	if (hint) wrap.append(hint);
	return wrap;
}

// A slot is the set of table entries one section controls.
function slotFor(sec) {
	const w = S.who, D = S.db;
	if (sec === "char") return { paths: [w.hero > 0 ? ["Hero Challenges", String(w.hero), "skills", "1"] : ["Skill Challenges", "1"]], samples: [1] };
	if (sec === "class") {
		if (!(w.cls > 0)) return null;
		const ids = learnIds(w.cls);
		return { paths: [["Class Challenges", String(w.cls), "default"]], legacy: ids.map(id => ["Class Challenges", String(w.cls), "skills", String(id)]), samples: ids.filter(id => infoOf(id).damaging).concat(ids.filter(id => !infoOf(id).damaging)) };
	}
	const learn = new Set(w.cls > 0 ? learnIds(w.cls) : []);
	return { paths: [w.hero > 0 ? ["Hero Challenges", String(w.hero), "default"] : ["Default Challenge"]], global: !(w.hero > 0),
		samples: D.skills.filter(s => s.id > 5 && !learn.has(s.id) && infoOf(s.id).damaging).map(s => s.id) };
}
const isTimingDefault = d => d && typeof d === "object" && Object.keys(d).length === 1 && d.type === "timing";
function slotValue(slot) {
	if (!slot.paths.length) return { state: "empty" };
	const vals = slot.paths.map(getAt), keys = vals.map(v => v === undefined ? "u" : JSON.stringify(v));
	if (!keys.every(k => k === keys[0])) return { state: "mixed", n: keys.filter(k => k !== keys[0]).length };
	if (slot.global) return { state: isTimingDefault(vals[0]) || vals[0] === undefined ? "default" : "same", def: vals[0] };
	return { state: vals[0] === undefined ? "default" : "same", def: vals[0] };
}
function setSlot(slot, def) {
	for (const p of slot.legacy || []) if (getAt(p) !== undefined) setAt(p, undefined); // old per-skill class entries would beat the class setting
	for (const p of slot.paths) {
		if (p[0] === "Default Challenge") { snap(); P(p[0]).v = JSON.stringify(def === undefined ? { type: "timing" } : clone(def)); S.dirty = true; updateHeader(); }
		else setAt(p, clone(def));
	}
}
const aboveOf = id => id === "class" ? "char" : (slotFor("class") ? "class" : "char");
function syncSame() {
	for (const id of ["class", "extra"]) {
		if (!S.same[id]) continue;
		const slot = slotFor(id); if (!slot) continue;
		const av = slotValue(slotFor(aboveOf(id)));
		if (av.state === "mixed" || av.state === "empty") continue;
		setSlot(slot, av.state === "default" ? undefined : av.def);
	}
}
function initSame() {
	S.same = {};
	for (const id of ["class", "extra"]) {
		const slot = slotFor(id); if (!slot) continue;
		const v = slotValue(slot), a = slotValue(slotFor(aboveOf(id)));
		S.same[id] = v.state === "same" && a.state === "same" && JSON.stringify(v.def) === JSON.stringify(a.def);
	}
}

// ---- warnings before a change touches other settings
function guardClass() {
	const w = S.who, key = "c" + w.cls; if (S.confirmed.class === key) return true;
	const n = learnIds(w.cls).filter(id => getAt(["Class Challenges", String(w.cls), "skills", String(id)]) !== undefined).length;

	if (n === 0) return true;

}

function fieldsInto(host, cur, upd) {
	const typeKey = cur.type || "timing";
	for (const [key, min, max, step, dflt] of TYPE_FIELDS[typeKey]) {
		const val = cur[key] !== undefined ? cur[key] : dflt;
		const rng = el("input", { type: "range", min, max, step, value: val });
		const num = el("input", { type: "number", min, max, step, value: val });
		const reset = el("button", { className: "sm", textContent: "↺", title: "Back to default (" + dflt + ")" });
		const set = v => { v = Number(v); if (!isFinite(v)) return; cur[key] = v; rng.value = num.value = v; upd(false); };

	const labs = S.lastLabels || ["OOPS...", "GOOD", "GREAT", "EXCELLENT!", "PERFECT!!"];
	const n = S.stats.reduce((a, b) => a + b, 0);
	$("stats").innerHTML = n ? "Results (" + n + "): " + S.stats.map((c, i) => '<span class="g' + i + '">' + labs[i] + " " + c + "</span>").join(" · ") + ' <button class="sm" id="resetStats">reset</button>' : "";
	const b = $("resetStats"); if (b) b.onclick = () => { S.stats = [0, 0, 0, 0, 0]; renderStats(); };
}

// ------------------------------------------------------------ files
function updateHeader() {
	$("dirty").textContent = S.dirty ? "● unsaved changes" : "";
	$("btnSave").disabled = !S.dir; $("mSave").disabled = !S.dir;
}
function setStatus(t) { $("status").textContent = t; }
function versionOf(code) { const m = /Quick Time Battle v([\d.]+)/.exec(code); return m ? m[1] : "?"; }

async function readJson(dir, name) { return JSON.parse(await (await (await dir.getFileHandle(name)).getFile()).text()); }
async function attach(h) {
	let plugin = null, db = null;
	try { // project folder: heroes.json at the top, plugin under Plugins/Quick Time Battle
		const [heroes, classes, skills] = await Promise.all(["heroes", "classes", "skills"].map(n => readJson(h, n + ".json")));
		const mk = (arr) => (arr || []).map(o => ({ id: o.id, name: o.name || (o.names && o.names["1"]) || ("#" + o.id), raw: o }));
		let elements = []; try { elements = mk((await readJson(h, "battleSystem.json")).elements); } catch (e) { /* optional */ }
		let variables = []; try { variables = (await readJson(h, "variables.json")).variables || []; } catch (e) { /* optional */ }
		if (!variables.length || !variables.every(p => p.list && p.list.length)) variables = [0, 1, 2, 3].map(i => ({ id: i + 1, name: "Page " + (i + 1), list: Array.from({ length: 25 }, (_, k) => ({ id: i * 25 + k + 1, name: "" })) }));
		db = { heroes: mk(heroes.heroes), classes: mk(classes.classes), skills: mk(skills.skills), elements, variables };
		plugin = await (await h.getDirectoryHandle("Plugins")).getDirectoryHandle(PLUGIN);
	} catch (e) { db = null; plugin = null; }
	if (!plugin) { // maybe the plugin folder itself
		try { await h.getFileHandle("details.json"); plugin = h; } catch (e) { /* no */ }
	}
	if (!plugin) { alert("Pick your RPG Paper Maker project folder (the one with heroes.json and Plugins), or the Quick Time Battle plugin folder."); return false; }
	let dtext;
	try { dtext = await (await (await plugin.getFileHandle("details.json")).getFile()).text(); }
	catch (e) { alert("The plugin folder has no details.json. Add the plugin to the project in the editor first."); return false; }
	S.root = h; S.dir = plugin; S.backedUp = false; S.db = db;
	loadDetails(JSON.parse(dtext), dtext);
	try { const c = await (await (await plugin.getFileHandle("code.js")).getFile()).text(); S.code = c; S.codeNote = "code.js v" + versionOf(c) + " from your project"; }
	catch (e) { S.code = EMBED_CODE; S.codeNote = "built-in copy of code.js"; }
	if (db) { const hid = db.heroes.some(o => o.id === S.test.hero) ? S.test.hero : (db.heroes[0] || {}).id; S.who = { hero: hid, cls: heroClass(hid) }; S.tab = "char"; S.active = "char"; S.sel = {}; initSame(); applyPreview();  startHero(); }
	setStatus((db ? "Project: " + h.name + " (" + db.heroes.length + " heroes, " + db.skills.length + " skills)" : "Plugin folder: " + h.name + " (no project data: IDs are typed in)") + " · testing " + S.codeNote);
	updateHeader(); renderSide(); scheduleRerun();
	return true;
}
$("btnOpen").onclick = async () => {
	if (!window.showDirectoryPicker) { alert("This browser can't open folders. Use Chrome or Edge, or Load / Download details.json."); return; }
	try {
		const prev = await idbGet("dir");
		const h = await showDirectoryPicker(Object.assign({ mode: "readwrite", id: "qtb-project" }, prev ? { startIn: prev } : {}));
		if (await attach(h)) idbSet("dir", h);
	} catch (e) { if (e.name !== "AbortError") console.error(e); }
};
$("btnReconnect").onclick = async () => {
	const h = await idbGet("dir"); if (!h) return;
	try { if ((await h.requestPermission({ mode: "readwrite" })) === "granted") { await attach(h); $("btnReconnect").style.display = "none"; } } catch (e) { console.error(e); }
};
$("btnUndo").onclick = undo;
$("mReset").onclick = () => { $("fileMenu").open = false; resetAll(); };
$("mOpen").onclick = () => { $("fileMenu").open = false; $("btnOpen").click(); };
$("mSave").onclick = () => { $("fileMenu").open = false; $("btnSave").click(); };
for (const id of ["btnRevert", "btnLoadFile", "btnDownload"]) $(id).addEventListener("click", () => { $("fileMenu").open = false; });
document.addEventListener("click", e => { const m = $("fileMenu"); if (m.open && !m.contains(e.target)) m.open = false; });
$("btnRevert").onclick = () => {
	if (!S.dirty) return;
	if (!confirm("Throw away all unsaved changes?")) return;
	snap(); const obj = JSON.parse(S.detailsText || JSON.stringify(EMBED_DETAILS)); const sel = S.db;
	loadDetails(obj, S.detailsText); S.dirty = false; updateHeader(); renderSide(); if (sel) applyPreview(); scheduleRerun();
};
window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/^(input|textarea)$/i.test(e.target.tagName)) { e.preventDefault(); undo(); } });
$("btnSave").onclick = async () => {
	if (!S.dir) return;
	try {
		if ((await (S.root || S.dir).requestPermission({ mode: "readwrite" })) !== "granted") return;
		if (!S.backedUp) {
			const bw = await (await S.dir.getFileHandle("details.backup.json", { create: true })).createWritable();
			await bw.write(S.detailsText); await bw.close(); S.backedUp = true;
		}
		const text = serialize();
		const w = await (await S.dir.getFileHandle("details.json", { create: true })).createWritable();
		await w.write(text); await w.close();
		S.detailsText = text; S.dirty = false; updateHeader();
		setStatus("Saved details.json (backup: details.backup.json).");
		modal("Saved", [el("div", { textContent: "The plugin settings are written. To use them in your game:" }),
			el("ol", {}, el("li", { textContent: "If the Quick Time Battle plugin window is open in RPG Paper Maker, close it WITHOUT pressing OK. Pressing OK would overwrite what you just saved." }),
				el("li", { textContent: "Reopen the project in the editor if it was already open (so it reads the new settings)." }),
				el("li", { textContent: "Start the game." })),
			el("div", { className: "hint", textContent: "A copy of your old settings is in details.backup.json." })]);
	} catch (e) { alert("Save failed: " + e.message); }
};
$("btnDownload").onclick = () => {
	const a = el("a", { href: URL.createObjectURL(new Blob([serialize()], { type: "application/json" })), download: "details.json" });
	document.body.append(a); a.click(); a.remove();
	modal("Downloaded", [el("ol", {}, el("li", { textContent: "Put the downloaded details.json into Plugins/Quick Time Battle in your project, replacing the old one." }),
		el("li", { textContent: "If the plugin window is open in RPG Paper Maker, close it without pressing OK, then start the game." }))]);
};
$("btnLoadFile").onclick = () => $("fileIn").click();
$("fileIn").onchange = async () => {
	const f = $("fileIn").files[0]; if (!f) return;
	try { const text = await f.text(); loadDetails(JSON.parse(text), text); S.dir = null; S.fileLoaded = true; setStatus("Loaded " + f.name + " (not linked to a folder: use Download)"); updateHeader(); renderSide(); scheduleRerun(); }
	catch (e) { alert("Not a valid details.json: " + e.message); }
	$("fileIn").value = "";
};
window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

// remembered folder handle
function idb() {
	return new Promise((res, rej) => { const r = indexedDB.open("qtb-tester", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbSet(k, v) { try { const d = await idb(); d.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) { /* ignore */ } }
async function idbGet(k) { try { const d = await idb(); return await new Promise(res => { const r = d.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } }

// ------------------------------------------------------------ boot
try { if (window.outerWidth < 1500 && window.screen) window.resizeTo(Math.min(screen.availWidth, 1700), Math.min(screen.availHeight, 1000)); } catch (e) { /* the host may not allow resizing */ }
$("btnRun").onclick = () => { if (!$("auto").dataset.ran) $("auto").dataset.ran = 1; startHero(); };
$("btnDodge").onclick = () => startDodge();
$("nEnemies").onchange = () => scheduleRerun();
$("size").onchange = () => { const [w, h] = $("size").value.split("x").map(Number); cv.width = w; cv.height = h; scheduleRerun(); };
loadDetails(EMBED_DETAILS, JSON.stringify(EMBED_DETAILS, null, "\t"));
setStatus("Using built-in settings. Click “Open project folder” to load your heroes, skills and settings.");
updateHeader(); renderSide(); renderStats();
requestAnimationFrame(loop);
idbGet("dir").then(async h => {
	if (!h || !window.showDirectoryPicker) return;
	try { if ((await h.queryPermission({ mode: "readwrite" })) === "granted" && await attach(h)) return; } catch (e) { /* needs a click */ }
	$("btnReconnect").style.display = ""; $("btnReconnect").textContent = "Reconnect “" + h.name + "”";
});
window.__qtb = { S, startHero, startDodge, get inst() { return inst; }, get scene() { return scene; } };
</script>
</body>
</html>
